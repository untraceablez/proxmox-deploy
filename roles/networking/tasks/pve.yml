---
- name: Install openvswitch package based on net_type
  when: net_type == "ovs-bridges"
  apt:
    name:
      - openvswitch-switch
    state: present
    update_cache: yes
    cache_valid_time: 3600
  tags:
    - networking
    - pve

- name: Backup existing interfaces file
  copy:
    src: /etc/network/interfaces
    dest: /etc/network/interfaces.backup
    remote_src: yes
  tags:
    - networking
    - pve

- name: Copy network configuration template based on net_type
  template:
    src: >-
      {%- if net_type == 'linux-bridges' -%}
        roles/networking/templates/linux-bridges.j2
      {%- elif net_type == 'linux-bonds' -%}
        roles/networking/templates/linux-bonds.j2
      {%- elif net_type == 'ovs-bonds' -%}
        roles/networking/templates/ovs-bonds.j2
      {%- elif net_type == 'ovs-bridges' -%}
        roles/networking/templates/ovs-bridges.j2
      {%- endif -%}
    dest: /etc/network/interfaces
  tags:
    - networking
    - pve

- name: Reload networking service
  service:
    name: networking
    state: restarted
  notify:
    - Restart network interfaces
  tags:
    - networking
    - pve